<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Pulau Pintar</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E9CCA">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#CFEFF7;--bg2:#F7E9B8;--card:#fff;--ink:#1F2A44;--sea:#2E9CCA;--sand:#FFD97A;--leaf:#3DAA6B;--coral:#FF8A78;--btn:#1F2A44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10233B;--bg2:#1A3150;--card:#1D3555;--ink:#F2F6FF}}
:root[data-theme="dark"]{--bg:#10233B;--bg2:#1A3150;--card:#1D3555;--ink:#F2F6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(var(--bg),var(--bg2));color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:20px;line-height:1.3}
#app{max-width:520px;margin:0 auto;padding:12px 16px 32px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;border:3px solid var(--ink);font-size:17px}
button{font:inherit;color:var(--btn);cursor:pointer;border:3px solid var(--ink);border-radius:22px;background:var(--sand);padding:12px 18px;font-weight:800;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
button[disabled]{opacity:.45;pointer-events:none}
.mascot{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:10px 14px;margin:6px 0 14px}
.mascot .m{font-size:52px;line-height:1}
.mascot p{margin:0;font-weight:700}
h1{font-size:34px;line-height:1.05;margin:8px 0 4px}
h2{font-size:26px;margin:4px 0 10px}
.age{display:grid;gap:14px;margin-top:14px}
.age button{display:flex;align-items:center;gap:16px;text-align:left;font-size:28px;padding:18px 20px}
.age b{font-size:52px}
.age small{display:block;font-size:17px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.isl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 8px;font-size:21px;min-height:150px;justify-content:center}
.isl b{font-size:56px}
.isl.lock{background:var(--card);color:var(--ink);opacity:.55;box-shadow:none;border-style:dashed}
.stars{font-size:20px;letter-spacing:2px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:16px;text-align:center}
.vis{font-size:38px;line-height:1.25;min-height:50px;word-break:break-word;margin:6px 0}
.q{font-size:32px;font-weight:800;margin:4px 0 10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.opts button{font-size:38px;padding:18px 0;background:var(--sea);color:#fff;text-shadow:0 2px 0 #0003}
.opts button.hint{animation:pulse .7s infinite alternate;background:var(--leaf)}
.opts button.no{opacity:.3;pointer-events:none}
@keyframes pulse{to{transform:scale(1.1)}}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.on{background:var(--leaf)}
.dots i.now{background:var(--sand)}
.clues{display:grid;gap:8px;margin:10px 0;text-align:left}
.clue{background:var(--bg2);border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:700}
.sus{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:12px;margin-top:12px}
.sus button{font-size:52px;padding:14px 0;background:var(--card);position:relative}
.sus button.x{opacity:.35;filter:grayscale(1)}
.sus button.x::after{content:"✖";position:absolute;inset:0;display:grid;place-items:center;font-size:56px;color:#E33}
.sus button.win{background:var(--leaf);animation:pulse .5s 3 alternate}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big{font-size:64px;margin:6px 0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.foot{text-align:center;margin-top:22px;font-size:15px;opacity:.7}
.gr{display:grid;gap:6px;margin:8px auto;max-width:340px}.gr div{aspect-ratio:1;display:grid;place-items:center;background:var(--bg2);border:3px solid var(--ink);border-radius:14px;font-size:34px}.gr .goal{background:var(--sand)}.q2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:46px;margin:8px 0}.q2 span{background:var(--sea);color:#fff;border-radius:12px;padding:2px 10px;font-weight:800;font-size:24px}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.pad button{font-size:28px;padding:10px 0}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pf button{display:flex;flex-direction:column;align-items:center;font-size:22px;padding:16px 6px}.pf b{font-size:58px;line-height:1}.pf small{font-size:15px;font-weight:600}.av{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.av button{font-size:34px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}.sel.on{background:var(--leaf);color:#fff}.inp{width:100%;font:inherit;font-size:24px;padding:10px 14px;border:3px solid var(--ink);border-radius:18px;background:var(--card);color:var(--ink);text-align:center;margin:8px 0}textarea.inp{font-size:13px;text-align:left;height:90px;font-family:monospace}.par .card{text-align:left;margin-bottom:14px}.par h2{font-size:22px;margin:0 0 6px}.par small{display:block;font-size:15px;opacity:.8;margin:4px 0}.rep{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:16px;margin:6px 0}.sm button{font-size:16px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:20px}.ov .card{max-width:340px;width:100%}.alb{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.alb div{aspect-ratio:1;display:grid;place-items:center;font-size:38px;background:var(--bg2);border:3px solid var(--ink);border-radius:18px}.alb div.no{opacity:.35;filter:grayscale(1)}.alb button{font-size:26px;padding:8px 0;line-height:1.1}.alb button small{font-size:13px}
.bd{position:relative}.bd .bk{position:absolute;border:3px solid var(--ink);border-radius:8px;box-sizing:border-box}.bd .sl{border-style:dashed;cursor:pointer}.bd .sl.hint{animation:pulse .7s infinite alternate;border-color:var(--leaf);border-style:solid}.bd .base{position:absolute;left:-6px;right:-6px;bottom:-14px;height:14px;background:var(--leaf);border:3px solid var(--ink);border-radius:6px}.lbl{font-size:15px;font-weight:700}.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}.pcb{height:40px;padding:0;border-radius:10px}.pcb.pick{outline:4px solid var(--sea);outline-offset:3px;animation:pulse .7s infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var AGES=[{n:"Si Kecil",r:"3-4 tahun",e:"🐣"},{n:"Si Tumbuh",r:"5-6 tahun",e:"🌱"},{n:"Si Jagoan",r:"7-8 tahun",e:"🚀"}];
var S={age:null,stars:{},sound:true,P:[],cur:null,limit:0,used:{d:"",s:0},par:false};
try{var d=JSON.parse(localStorage.getItem("pp2")||"null");
 if(d&&d.P){S.P=d.P;S.cur=d.cur;S.limit=d.limit||0;S.used=d.used||S.used}
 else{var o=JSON.parse(localStorage.getItem("pp1")||"{}");if(o.age!==undefined&&o.age!==null){S.P=[{id:1,name:"Anak 1",av:"🦁",age:o.age,stars:o.stars||{},log:[]}];S.cur=1}}
}catch(e){}
function curP(){return S.P.filter(function(p){return p.id===S.cur})[0]}
function useP(p){S.cur=p.id;S.age=p.age;S.stars=p.stars}
var cp0=curP();if(cp0)useP(cp0);
function save(){try{localStorage.setItem("pp2",JSON.stringify({P:S.P,cur:S.cur,limit:S.limit,used:S.used}))}catch(e){}}
function say(t,l){if(!S.sound)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);l=l||"id-ID";u.lang=l;u.rate=.85;u.pitch=1.2;var v=speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-").indexOf(l.slice(0,2))===0});if(v.length){var f=v.filter(function(x){return /female|google|natural/i.test(x.name)});u.voice=f[0]||v[0]}speechSynthesis.speak(u)}catch(e){}}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[rnd(0,a.length-1)]}
function shuf(a){return a.sort(function(){return Math.random()-.5})}
var BG={},SEEN={};function bag(k,a){if(!BG[k]||!BG[k].length)BG[k]=shuf(a.slice());return BG[k].pop()}
var AC=null;
function sfx(t){
 if(!S.sound)return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  var N={tap:[[520,.05]],ok:[[660,.1],[880,.18]],no:[[392,.12],[349,.2]],win:[[523,.1],[659,.1],[784,.1],[1047,.28]]}[t],at=AC.currentTime,v={tap:.04,no:.08,ok:.12,win:.12}[t];
  N.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type=t==="no"?"triangle":"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+n[1]);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+n[1]+.02);at+=n[1]*.9});
 }catch(e){}
}
document.addEventListener("click",function(e){if(e.target&&e.target.closest&&e.target.closest("button"))sfx("tap")});
function stars(n){return "⭐".repeat(n)+"☆".repeat(3-n)}
function best(k,n){var key=S.age+":"+k,p=curP();if(n>(S.stars[key]||0))S.stars[key]=n;if(p)p.log=(p.log||[]).concat([{d:today(),k:k,a:S.age,n:n}]).slice(-120);save();gift(p,n)}
var STK=["🦄","🐼","🦊","🐨","🐯","🦁","🐸","🐙","🦋","🐢","🦒","🐧","🐬","🦉","🐞","🐳","🦖","🚀","🌈","🍦","🎈","👑","🏆","💎"];
function gift(p,n){
 if(!p)return;p.stk=p.stk||[];
 var left=STK.filter(function(x){return p.stk.indexOf(x)<0}),g=shuf(left).slice(0,n>=3?2:1);
 if(!g.length)return;
 p.stk=p.stk.concat(g);save();
 var o=document.createElement("div");o.className="ov";
 o.innerHTML='<div class="card"><div class="big">'+g.join(" ")+'</div><h2>Stiker baru!</h2><p>Sudah '+p.stk.length+' dari '+STK.length+' di albummu.</p><button>Yeay!</button></div>';
 document.body.appendChild(o);sfx("win");o.querySelector("button").onclick=function(){o.remove()};
 setTimeout(function(){if(o.parentNode)say("Hore! Kamu dapat stiker baru!")},1500);
}
function screenAlbum(){
 var p=curP(),h=(p&&p.stk)||[];
 app.innerHTML=bar(1)+mascot("Ini albumku! Main terus untuk dapat stiker baru.")+'<div class="card"><h2>📒 Album stiker ('+h.length+'/'+STK.length+')</h2><div class="alb">'+STK.map(function(x){return h.indexOf(x)>=0?'<div>'+x+'</div>':'<div class="no">❔</div>'}).join("")+'</div></div>';
 wire(screenMap);say("Ini albumku! Main terus untuk dapat stiker baru.");
}
function getStars(k){return S.stars[S.age+":"+k]||0}
var $=function(s){return document.querySelector(s)};
var app=$("#app");
function bar(back){return '<div class="bar">'+(back?'<button id="bk" aria-label="Kembali">⬅</button>':'<span></span>')+'<span class="chip">'+(S.age!==null?(curP()?curP().av:AGES[S.age].e)+" "+AGES[S.age].n:"")+'</span><button id="snd" aria-label="Suara">'+(S.sound?"🔊":"🔇")+'</button></div>'}
function wire(back){var s=$("#snd");if(s)s.onclick=function(){S.sound=!S.sound;s.textContent=S.sound?"🔊":"🔇";if(!S.sound)try{speechSynthesis.cancel()}catch(e){}};var b=$("#bk");if(b)b.onclick=back}
function mascot(msg){return '<div class="mascot"><span class="m">🐱</span><p>'+msg+'</p></div>'}

/* ---- Pilih usia ---- */
function screenAge(){
  var h='<h1>Petualangan Pulau Pintar</h1>'+mascot("Halo! Aku Detektif Kumis. Kamu umur berapa?");
  h+='<div class="age">';
  AGES.forEach(function(a,i){h+='<button data-i="'+i+'"><b>'+a.e+'</b><span>'+a.n+'<small>'+a.r+'</small></span></button>'});
  app.innerHTML=h+'</div><p class="foot">Prototipe • 7 pulau: Angka, Detektif, Teka-teki, Robot, Kata, Sains, Balok</p>';
  say("Halo! Aku Detektif Kumis. Kamu umur berapa?");
  app.querySelectorAll(".age button").forEach(function(b){b.onclick=function(){S.age=+b.dataset.i;save();screenMap()}});
}

/* ---- Peta ---- */
function screenMap(){
  var I=[{id:"angka",n:"Pulau Angka",e:"🔢",f:screenAngka},{id:"det",n:"Pulau Detektif",e:"🕵️",f:screenDetMenu},{id:"tk",n:"Teka-teki",e:"🧩",f:screenTeka},{id:"rb",n:"Robot",e:"🤖",f:screenRobot},{id:"kt",n:"Kata",e:"🔤",f:screenKata},{id:"sn",n:"Sains",e:"🔬",f:screenSains},{id:"bl",n:"Pulau Balok",e:"🧱",f:screenBalok}];
  var h=bar(0)+mascot("Pilih pulau yang mau kamu kunjungi!")+'<div class="grid">';
  I.forEach(function(x,i){
    if(x.f)h+='<button class="isl" data-i="'+i+'" style="background:'+(x.id==="angka"?"var(--sand)":x.id==="det"?"var(--coral)":x.id==="tk"?"#B9E6A8":x.id==="kt"?"#9FD8F0":x.id==="sn"?"#F5B8D6":x.id==="bl"?"#FFC48A":"#C9B8F5")+'"><b>'+x.e+'</b>'+x.n+'<span class="stars">'+stars(getStars(x.id))+'</span></button>';
    else h+='<button class="isl lock" disabled><b>'+x.e+'</b>'+x.n+'<small>Segera hadir</small></button>';
  });
  app.innerHTML=h+'</div><div class="row"><button id="al">📒 Album '+((curP()&&curP().stk||[]).length)+'/'+STK.length+'</button><button id="ga">Ganti anak</button><button id="pa">🔒 Orang tua</button></div>';
  wire();say("Pilih pulau yang mau kamu kunjungi!");
  app.querySelectorAll(".isl:not(.lock)").forEach(function(b){b.onclick=function(){I[+b.dataset.i].f()}});
  $("#al").onclick=screenAlbum;$("#ga").onclick=screenWho;$("#pa").onclick=screenPin;
}

/* ---- Pulau Balok ---- */
var BC=["#E8504A","#378ADD","#F2B632","#3DAA6B","#8B6FD6"],CN=["merah","biru","kuning","hijau","ungu"];
var BM=[
 [{n:"Tangga",c:3,r:3,p:[[0,0,3,0],[0,1,2,1],[0,2,1,2]]},
  {n:"Rumah",c:4,r:3,p:[[0,0,4,1],[0,1,1,2],[3,1,1,2],[0,2,4,0]]},
  {n:"Jembatan",c:5,r:2,p:[[0,0,1,3],[4,0,1,3],[0,1,5,4]]}],
 [{n:"Rumah besar",c:5,r:4,p:[[0,0,5,3],[0,1,2,1],[3,1,2,1],[0,2,5,0],[1,3,3,2]]},
  {n:"Menara",c:4,r:4,p:[[0,0,4,0],[0,1,3,1],[0,2,2,2],[0,3,1,3],[3,1,1,4]]},
  {n:"Piramida",c:6,r:4,p:[[0,0,6,1],[1,1,4,0],[2,2,2,2],[2,3,1,3],[3,3,1,4]]}],
 [{n:"Kastil",c:6,r:4,p:[[0,0,6,4],[0,1,2,0],[2,1,2,1],[4,1,2,0],[0,2,3,2],[3,2,3,2],[1,3,4,3]]},
  {n:"Menara kembar",c:6,r:5,p:[[0,0,6,1],[0,1,2,0],[4,1,2,0],[0,2,2,2],[4,2,2,2],[0,3,2,3],[4,3,2,3],[0,4,6,4]]},
  {n:"Kota",c:6,r:4,p:[[0,0,6,3],[0,1,2,0],[2,1,1,1],[3,1,3,2],[0,2,1,4],[3,2,2,0],[3,3,1,1]]}]
];
function screenBalok(){
  var A=S.age,M=bag("bl"+A,BM[A]),P=M.p,cols=M.c,rows=M.r;
  var fill=P.map(function(){return false}),used=P.map(function(){return false});
  var sel=null,miss=0,sm=0,over=false,res=0;
  var order=shuf(P.map(function(x,i){return i}));
  var u=Math.min(56,Math.floor(Math.min(340,(window.innerWidth||360)-72)/cols)),um=Math.min(24,Math.floor(120/cols));
  function solid(c,w){return "background-color:"+BC[c]+";background-image:radial-gradient(circle,#ffffff66 26%,transparent 30%);background-size:"+w+"px "+w+"px;background-repeat:repeat-x"}
  function pos(p,w){return "left:"+p[0]*w+"px;bottom:"+p[1]*w+"px;width:"+p[2]*w+"px;height:"+w+"px;"}
  function fits(j){return sel!==null&&!fill[j]&&P[j][2]===P[sel][2]&&P[j][3]===P[sel][3]}
  function msg(t){var m=$(".mascot p");if(m)m.textContent=t;say(t)}
  function draw(){
    var hint=sel!==null&&(A===0||sm>=2),h=bar(1)+'<div class="card"><h2>🧱 '+M.n+'</h2><div class="lbl">Contoh</div>';
    h+='<div class="bd" style="width:'+cols*um+'px;height:'+rows*um+'px;margin:8px auto 16px">';
    P.forEach(function(p){h+='<div class="bk" style="'+pos(p,um)+solid(p[3],um)+';border-width:2px;border-radius:4px"></div>'});
    h+='<div class="base" style="height:8px;bottom:-10px;border-width:2px"></div></div>';
    h+='<div class="lbl">'+(over?'Hasilmu':'Susun di sini')+'</div><div class="bd" id="bd" style="width:'+cols*u+'px;height:'+rows*u+'px">';
    P.forEach(function(p,j){
      if(fill[j])h+='<div class="bk" style="'+pos(p,u)+solid(p[3],u)+'"></div>';
      else h+='<div class="bk sl'+(hint&&fits(j)?" hint":"")+'" data-j="'+j+'" style="'+pos(p,u)+'background:'+(A===0?BC[p[3]]+"55":"#0000001a")+'"></div>';
    });
    h+='<div class="base"></div></div>';
    if(over)h+='<div class="stars" style="font-size:34px">'+stars(res)+'</div><div class="row"><button id="ag">Bangun lagi 🧱</button><button id="mp">Ke peta 🗺️</button></div>';
    else{
      h+='<div class="tray">';
      order.forEach(function(i){if(!used[i])h+='<button class="pcb'+(i===sel?" pick":"")+'" data-i="'+i+'" aria-label="Balok '+CN[P[i][3]]+'" style="width:'+(P[i][2]*30+6)+'px;'+solid(P[i][3],30)+'"></button>'});
      h+='</div>';
    }
    app.innerHTML=h+'</div>'+mascot(over?"Bangunannya jadi! Kamu hebat!":sel===null?"Pilih satu balok di bawah!":"Taruh di bayangan yang pas!");
    wire(screenMap);
    app.querySelectorAll(".pcb").forEach(function(b){b.onclick=function(){
      if(over)return;sel=+b.dataset.i;sm=0;draw();say("Balok "+CN[P[sel][3]]+". Taruh di bayangannya!")}});
    app.querySelectorAll(".sl").forEach(function(b){b.onclick=function(){place(+b.dataset.j)}});
    var ag=$("#ag"),mp=$("#mp");if(ag)ag.onclick=screenBalok;if(mp)mp.onclick=screenMap;
  }
  function place(j){
    if(over||!$("#bd"))return;
    if(sel===null){msg("Pilih balok dulu ya!");return}
    if(fits(j)){
      fill[j]=true;used[sel]=true;sel=null;sm=0;
      if(fill.every(function(x){return x})){
        over=true;res=A===0?3:miss<=1?3:miss<=4?2:1;draw();sfx("win");say("Hore! "+M.n+" sudah jadi!");best("bl",res);
      }else{sfx("ok");draw();msg(pick(PUJI))}
    }else{
      miss++;sm++;sfx("no");
      if(sm===2)draw();else{var b=$("#bd");b.classList.add("shake");setTimeout(function(){b.classList.remove("shake")},400)}
      msg("Coba bayangan yang lain ya!");
    }
  }
  draw();say("Ayo susun balok seperti contoh! Pilih satu balok, lalu taruh di bayangannya.");
}

/* ---- Pulau Angka ---- */
function mkQ(a,L){

function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return ymd(d)}
function over(){if(S.used.d!==today())S.used={d:today(),s:0};return S.limit>0&&S.used.s>=S.limit*60}
